const pages=[{"id": "index", "title": "개요 · 학습 지도", "html": "<h1>Git &amp; GitHub<\/h1>\n<p>Git은 <strong>파일 변경 이력을 기록하고 관리하는 버전 관리 시스템<\/strong>입니다. GitHub는 Git 저장소를 원격에서 보관하고 협업할 수 있게 하는 서비스입니다.<\/p>\n<p>빠르게 명령어를 찾으려면 <a href=\"#cheatsheet\">상황별 치트시트<\/a>부터 보세요.<\/p>\n<h2>어디부터 볼까?<\/h2>\n<table>\n<thead>\n<tr>\n  <th>알고 싶은 것<\/th>\n  <th>문서<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Git은 파일 변경을 어떻게 추적할까?<\/td>\n  <td><a href=\"#concepts\">핵심 개념과 작업 흐름<\/a><\/td>\n<\/tr>\n<tr>\n  <td>코드를 저장하고 커밋하려면?<\/td>\n  <td><a href=\"#basics\">기본 명령어<\/a><\/td>\n<\/tr>\n<tr>\n  <td>여러 작업을 나눠 개발하려면?<\/td>\n  <td><a href=\"#branches\">Branch &amp; Merge<\/a><\/td>\n<\/tr>\n<tr>\n  <td>GitHub에 올리거나 가져오려면?<\/td>\n  <td><a href=\"#remotes\">원격 저장소<\/a><\/td>\n<\/tr>\n<tr>\n  <td>상황에 맞는 명령어만 찾고 싶다면?<\/td>\n  <td><a href=\"#cheatsheet\">상황별 치트시트<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>가장 자주 쓰는 명령어 6개<\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git status                 # 현재 상태 확인\ngit add .                  # 현재 디렉터리 아래 변경 사항 스테이징\ngit commit -m &quot;메시지&quot;    # 로컬 변경 이력 저장\ngit switch -c feature     # 새 브랜치 생성 및 이동\ngit pull origin main      # 원격 main의 변경 사항 가져와 통합\ngit push origin main      # 로컬 main을 원격으로 전송\n<\/code><\/pre><\/div>\n<blockquote>\n<p><strong>팁<\/strong> 검색 팁\n검색창에 <code>commit<\/code>, <code>충돌<\/code>, <code>clone<\/code>, <code>stash<\/code>처럼 명령어 또는 문제 상황을 그대로 입력해 보세요.<\/p>\n<\/blockquote>\n<h2>출처<\/h2>\n<ul>\n<li><a href=\"https://git-scm.com/docs\">공식 Git 문서<\/a><\/li>\n<li><a href=\"https://git-scm.com/book/ko/v2\">Pro Git 도서 (공식 무료 문서)<\/a><\/li>\n<\/ul>\n<blockquote>\n<p><strong>참고<\/strong> 예시 문서\n이 챕터는 실제 강의자료를 아직 반영하지 않은 <strong>초기 예제 콘텐츠<\/strong>입니다. 제공된 강의자료는 검토 후 적절한 문서에 통합하고 출처를 표시합니다.<\/p>\n<\/blockquote>\n", "plain": "# git & github\n\ngit은 **파일 변경 이력을 기록하고 관리하는 버전 관리 시스템**입니다. github는 git 저장소를 원격에서 보관하고 협업할 수 있게 하는 서비스입니다.\n\n빠르게 명령어를 찾으려면 [상황별 치트시트](./cheatsheet)부터 보세요.\n\n## 어디부터 볼까?\n\n| 알고 싶은 것 | 문서 |\n| --- | --- |\n| git은 파일 변경을 어떻게 추적할까? | [핵심 개념과 작업 흐름](./concepts) |\n| 코드를 저장하고 커밋하려면? | [기본 명령어](./basics) |\n| 여러 작업을 나눠 개발하려면? | [branch & merge](./branches) |\n| github에 올리거나 가져오려면? | [원격 저장소](./remotes) |\n| 상황에 맞는 명령어만 찾고 싶다면? | [상황별 치트시트](./cheatsheet) |\n\n## 가장 자주 쓰는 명령어 6개\n\n```bash\ngit status                 # 현재 상태 확인\ngit add .                  # 현재 디렉터리 아래 변경 사항 스테이징\ngit commit -m \"메시지\"    # 로컬 변경 이력 저장\ngit switch -c feature     # 새 브랜치 생성 및 이동\ngit pull origin main      # 원격 main의 변경 사항 가져와 통합\ngit push origin main      # 로컬 main을 원격으로 전송\n```\n\n> **팁** 검색 팁\n> 검색창에 `commit`, `충돌`, `clone`, `stash`처럼 명령어 또는 문제 상황을 그대로 입력해 보세요.\n\n## 출처\n\n- [공식 git 문서](https://git-scm.com/docs)\n- [pro git 도서 (공식 무료 문서)](https://git-scm.com/book/ko/v2)\n\n> **참고** 예시 문서\n> 이 챕터는 실제 강의자료를 아직 반영하지 않은 **초기 예제 콘텐츠**입니다. 제공된 강의자료는 검토 후 적절한 문서에 통합하고 출처를 표시합니다.\n"}, {"id": "concepts", "title": "핵심 개념과 작업 흐름", "html": "<h1>01. 핵심 개념과 작업 흐름<\/h1>\n<h2>Git과 GitHub의 차이<\/h2>\n<ul>\n<li><strong>Git<\/strong>: 내 컴퓨터에서 프로젝트 변경 이력을 기록하고 비교하는 버전 관리 도구<\/li>\n<li><strong>GitHub<\/strong>: 원격 Git 저장소를 호스팅하고 이슈, Pull Request 등을 통해 협업하는 플랫폼<\/li>\n<\/ul>\n<p>Git은 GitHub 없이도 로컬에서 사용할 수 있습니다.<\/p>\n<h2>변경 사항이 거치는 세 영역<\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-text\">Working Directory          Staging Area             Local Repository\n  파일 편집       --add--&gt;    커밋 후보       --commit--&gt;   커밋 기록\n       |                                                    |\n       +--------------- git status -------------------------+\n<\/code><\/pre><\/div>\n<ol>\n<li><strong>Working Directory<\/strong>: 현재 작업 중인 파일들<\/li>\n<li><strong>Staging Area (Index)<\/strong>: 다음 커밋에 포함하기로 선택한 변경 사항<\/li>\n<li><strong>Local Repository<\/strong>: <code>git commit<\/code>으로 기록된 변경 이력<\/li>\n<\/ol>\n<p>원격 저장소(GitHub 등)는 별도이며 <code>git push<\/code>로 로컬 커밋을 보낼 수 있습니다.<\/p>\n<h2><code>add<\/code>와 <code>commit<\/code>을 구분하기<\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git add README.md\ngit commit -m &quot;docs: README 설명 추가&quot;\n<\/code><\/pre><\/div>\n<p><code>add<\/code>는 파일을 곧바로 GitHub에 올리는 것이 아닙니다. 커밋 대상으로 <strong>선택<\/strong>하는 과정입니다. <code>commit<\/code>은 선택한 변경 내용을 <strong>로컬 이력에 기록<\/strong>합니다.<\/p>\n<h2>핵심 용어<\/h2>\n<table>\n<thead>\n<tr>\n  <th>용어<\/th>\n  <th>뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Repository<\/td>\n  <td>Git이 버전 이력을 관리하는 저장소<\/td>\n<\/tr>\n<tr>\n  <td>Commit<\/td>\n  <td>특정 시점의 변경 내용과 메타데이터를 가리키는 기록<\/td>\n<\/tr>\n<tr>\n  <td>Branch<\/td>\n  <td>특정 커밋을 가리키는 이동 가능한 이름<\/td>\n<\/tr>\n<tr>\n  <td>HEAD<\/td>\n  <td>현재 체크아웃한 브랜치 또는 커밋을 가리키는 참조<\/td>\n<\/tr>\n<tr>\n  <td>Remote<\/td>\n  <td><code>origin<\/code> 같은 이름으로 등록한 원격 저장소<\/td>\n<\/tr>\n<tr>\n  <td>Merge<\/td>\n  <td>분리된 작업 이력을 합치는 작업<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>함께 보기<\/h2>\n<ul>\n<li><a href=\"#basics\">기본 명령어<\/a><\/li>\n<li><a href=\"#branches\">Branch &amp; Merge<\/a><\/li>\n<\/ul>\n", "plain": "# 01. 핵심 개념과 작업 흐름\n\n## git과 github의 차이\n\n- **git**: 내 컴퓨터에서 프로젝트 변경 이력을 기록하고 비교하는 버전 관리 도구\n- **github**: 원격 git 저장소를 호스팅하고 이슈, pull request 등을 통해 협업하는 플랫폼\n\ngit은 github 없이도 로컬에서 사용할 수 있습니다.\n\n## 변경 사항이 거치는 세 영역\n\n```text\nworking directory          staging area             local repository\n  파일 편집       --add-->    커밋 후보       --commit-->   커밋 기록\n       |                                                    |\n       +--------------- git status -------------------------+\n```\n\n1. **working directory**: 현재 작업 중인 파일들\n2. **staging area (index)**: 다음 커밋에 포함하기로 선택한 변경 사항\n3. **local repository**: `git commit`으로 기록된 변경 이력\n\n원격 저장소(github 등)는 별도이며 `git push`로 로컬 커밋을 보낼 수 있습니다.\n\n## `add`와 `commit`을 구분하기\n\n```bash\ngit add readme.md\ngit commit -m \"docs: readme 설명 추가\"\n```\n\n`add`는 파일을 곧바로 github에 올리는 것이 아닙니다. 커밋 대상으로 **선택**하는 과정입니다. `commit`은 선택한 변경 내용을 **로컬 이력에 기록**합니다.\n\n## 핵심 용어\n\n| 용어 | 뜻 |\n| --- | --- |\n| repository | git이 버전 이력을 관리하는 저장소 |\n| commit | 특정 시점의 변경 내용과 메타데이터를 가리키는 기록 |\n| branch | 특정 커밋을 가리키는 이동 가능한 이름 |\n| head | 현재 체크아웃한 브랜치 또는 커밋을 가리키는 참조 |\n| remote | `origin` 같은 이름으로 등록한 원격 저장소 |\n| merge | 분리된 작업 이력을 합치는 작업 |\n\n## 함께 보기\n\n- [기본 명령어](./basics)\n- [branch & merge](./branches)\n"}, {"id": "basics", "title": "기본 명령어", "html": "<h1>02. 기본 명령어<\/h1>\n<p>Git 프로젝트를 시작하고 파일 변경을 기록할 때 가장 먼저 사용하는 명령어입니다.<\/p>\n<h2>저장소 만들기: <code>git init<\/code><\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">mkdir my-project\ncd my-project\ngit init\n<\/code><\/pre><\/div>\n<p>현재 폴더에 <code>.git<\/code> 디렉터리가 생성되고 Git 이력 관리가 시작됩니다. 기존 원격 저장소를 내려받는 작업은 <a href=\"#remotes\"><code>git clone<\/code><\/a>을 사용합니다.<\/p>\n<h2>현재 상태 확인: <code>git status<\/code><\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git status\n<\/code><\/pre><\/div>\n<p>변경된 파일, 스테이징된 파일, 아직 추적되지 않는 파일 등을 보여줍니다. 실습 중 예상과 다른 결과가 나오면 가장 먼저 확인하세요.<\/p>\n<h2>스테이징: <code>git add<\/code><\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git add README.md       # 특정 파일\ngit add .               # 현재 디렉터리 이하의 변경 사항\ngit add -A              # 저장소 전체의 추가·수정·삭제 반영\n<\/code><\/pre><\/div>\n<blockquote>\n<p><strong>주의<\/strong> 주의\n<code>git add .<\/code>는 상황에 따라 비밀키나 큰 파일까지 포함할 수 있습니다. <code>git status<\/code>로 확인하고, <code>.env<\/code> 등 민감한 파일은 <code>.gitignore<\/code>로 제외하세요. 이미 추적 중인 파일은 <code>.gitignore<\/code>만 추가해도 추적이 중단되지 않습니다.<\/p>\n<\/blockquote>\n<h2>커밋: <code>git commit<\/code><\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git commit -m &quot;docs: Git 기본 명령어 추가&quot;\n<\/code><\/pre><\/div>\n<p>커밋은 로컬 저장소의 이력을 기록합니다. GitHub에 반영하려면 <a href=\"#remotes\"><code>git push<\/code><\/a>가 필요합니다.<\/p>\n<h2>이력 확인: <code>git log<\/code><\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git log --oneline --graph --decorate -10\n<\/code><\/pre><\/div>\n<p>가장 최근 10개 커밋을 한 줄씩 트리 형태로 보여줍니다.<\/p>\n<h2>변경 내용 비교: <code>git diff<\/code><\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git diff                  # 아직 스테이징하지 않은 변경\ngit diff --staged         # 다음 커밋에 포함할 변경\n<\/code><\/pre><\/div>\n<h2>파일 무시: <code>.gitignore<\/code><\/h2>\n<p>프로젝트 최상위 <code>.gitignore<\/code> 예시:<\/p>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-gitignore\">.env\n.venv/\n__pycache__/\nnode_modules/\n.DS_Store\n<\/code><\/pre><\/div>\n<p>환경설정 비밀값이나 생성 파일을 불필요하게 커밋하지 않도록 지정합니다. 이미 커밋한 비밀값은 별도의 제거 및 키 교체 조치가 필요합니다.<\/p>\n<h2>실습 흐름<\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git init\ngit status\ngit add README.md\ngit diff --staged\ngit commit -m &quot;docs: first commit&quot;\ngit log --oneline\n<\/code><\/pre><\/div>\n<h2>함께 보기<\/h2>\n<ul>\n<li><a href=\"#concepts\">핵심 개념<\/a><\/li>\n<li><a href=\"#remotes\">원격 저장소<\/a><\/li>\n<\/ul>\n", "plain": "# 02. 기본 명령어\n\ngit 프로젝트를 시작하고 파일 변경을 기록할 때 가장 먼저 사용하는 명령어입니다.\n\n## 저장소 만들기: `git init`\n\n```bash\nmkdir my-project\ncd my-project\ngit init\n```\n\n현재 폴더에 `.git` 디렉터리가 생성되고 git 이력 관리가 시작됩니다. 기존 원격 저장소를 내려받는 작업은 [`git clone`](./remotes#원격-저장소-복제-git-clone)을 사용합니다.\n\n## 현재 상태 확인: `git status`\n\n```bash\ngit status\n```\n\n변경된 파일, 스테이징된 파일, 아직 추적되지 않는 파일 등을 보여줍니다. 실습 중 예상과 다른 결과가 나오면 가장 먼저 확인하세요.\n\n## 스테이징: `git add`\n\n```bash\ngit add readme.md       # 특정 파일\ngit add .               # 현재 디렉터리 이하의 변경 사항\ngit add -a              # 저장소 전체의 추가·수정·삭제 반영\n```\n\n> **주의** 주의\n> `git add .`는 상황에 따라 비밀키나 큰 파일까지 포함할 수 있습니다. `git status`로 확인하고, `.env` 등 민감한 파일은 `.gitignore`로 제외하세요. 이미 추적 중인 파일은 `.gitignore`만 추가해도 추적이 중단되지 않습니다.\n\n## 커밋: `git commit`\n\n```bash\ngit commit -m \"docs: git 기본 명령어 추가\"\n```\n\n커밋은 로컬 저장소의 이력을 기록합니다. github에 반영하려면 [`git push`](./remotes#원격으로-보내기-git-push)가 필요합니다.\n\n## 이력 확인: `git log`\n\n```bash\ngit log --oneline --graph --decorate -10\n```\n\n가장 최근 10개 커밋을 한 줄씩 트리 형태로 보여줍니다.\n\n## 변경 내용 비교: `git diff`\n\n```bash\ngit diff                  # 아직 스테이징하지 않은 변경\ngit diff --staged         # 다음 커밋에 포함할 변경\n```\n\n## 파일 무시: `.gitignore`\n\n프로젝트 최상위 `.gitignore` 예시:\n\n```gitignore\n.env\n.venv/\n__pycache__/\nnode_modules/\n.ds_store\n```\n\n환경설정 비밀값이나 생성 파일을 불필요하게 커밋하지 않도록 지정합니다. 이미 커밋한 비밀값은 별도의 제거 및 키 교체 조치가 필요합니다.\n\n## 실습 흐름\n\n```bash\ngit init\ngit status\ngit add readme.md\ngit diff --staged\ngit commit -m \"docs: first commit\"\ngit log --oneline\n```\n\n## 함께 보기\n\n- [핵심 개념](./concepts)\n- [원격 저장소](./remotes)\n"}, {"id": "branches", "title": "Branch & Merge", "html": "<h1>03. Branch &amp; Merge<\/h1>\n<p>브랜치는 하나의 작업 이력에서 새로운 작업 흐름을 나누기 위해 사용하는 포인터입니다.<\/p>\n<h2>브랜치 목록: <code>git branch<\/code><\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git branch       # 로컬 브랜치 목록\ngit branch -a    # 원격 추적 브랜치 포함\ngit branch -vv   # 추적 관계 및 마지막 커밋\n<\/code><\/pre><\/div>\n<p>현재 브랜치에는 <code>*<\/code> 표시가 붙습니다.<\/p>\n<h2>생성 및 이동: <code>git switch<\/code><\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git switch -c feature/login   # 새 브랜치 생성 후 이동\ngit switch main               # main으로 이동\n<\/code><\/pre><\/div>\n<p><code>git branch feature/login<\/code>은 브랜치만 생성합니다. 브랜치 전환에는 <code>git switch<\/code>를 사용합니다.<\/p>\n<h2>병합: <code>git merge<\/code><\/h2>\n<p><code>feature/login<\/code>의 작업을 <code>main<\/code>에 합치려면:<\/p>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git switch main\ngit merge feature/login\n<\/code><\/pre><\/div>\n<p>병합 시점과 이력에 따라 <strong>fast-forward<\/strong> 또는 <strong>merge commit<\/strong> 형태로 진행됩니다.<\/p>\n<h2>충돌(conflict)이 발생하면?<\/h2>\n<p>같은 부분을 양쪽에서 다르게 수정했을 때 충돌이 발생할 수 있습니다.<\/p>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-text\">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD\nmain 브랜치의 내용\n=======\nfeature 브랜치의 내용\n&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/login\n<\/code><\/pre><\/div>\n<p>충돌 마커를 제거하고 원하는 최종 내용을 작성한 뒤:<\/p>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git status\ngit add 충돌난파일.md\ngit commit                   # 일반 병합 충돌을 수동 해결한 경우\n<\/code><\/pre><\/div>\n<blockquote>\n<p><strong>팁<\/strong>\n병합을 중단하고 이전 상태로 돌아가려면 <code>git merge --abort<\/code>를 사용할 수 있습니다. 단, 병합 전에 미커밋 변경 사항이 있었다면 복구가 복잡할 수 있어 먼저 작업 상태를 확인하세요.<\/p>\n<\/blockquote>\n<h2>브랜치 삭제<\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git branch -d feature/login  # 이미 병합된 브랜치를 안전하게 삭제\ngit branch -D feature/login  # 병합 여부와 무관하게 강제 삭제 (주의)\n<\/code><\/pre><\/div>\n<h2>함께 보기<\/h2>\n<ul>\n<li><a href=\"#remotes\">원격 저장소<\/a><\/li>\n<li><a href=\"#cheatsheet\">상황별 치트시트<\/a><\/li>\n<\/ul>\n", "plain": "# 03. branch & merge\n\n브랜치는 하나의 작업 이력에서 새로운 작업 흐름을 나누기 위해 사용하는 포인터입니다.\n\n## 브랜치 목록: `git branch`\n\n```bash\ngit branch       # 로컬 브랜치 목록\ngit branch -a    # 원격 추적 브랜치 포함\ngit branch -vv   # 추적 관계 및 마지막 커밋\n```\n\n현재 브랜치에는 `*` 표시가 붙습니다.\n\n## 생성 및 이동: `git switch`\n\n```bash\ngit switch -c feature/login   # 새 브랜치 생성 후 이동\ngit switch main               # main으로 이동\n```\n\n`git branch feature/login`은 브랜치만 생성합니다. 브랜치 전환에는 `git switch`를 사용합니다.\n\n## 병합: `git merge`\n\n`feature/login`의 작업을 `main`에 합치려면:\n\n```bash\ngit switch main\ngit merge feature/login\n```\n\n병합 시점과 이력에 따라 **fast-forward** 또는 **merge commit** 형태로 진행됩니다.\n\n## 충돌(conflict)이 발생하면?\n\n같은 부분을 양쪽에서 다르게 수정했을 때 충돌이 발생할 수 있습니다.\n\n```text\n<<<<<<< head\nmain 브랜치의 내용\n=======\nfeature 브랜치의 내용\n>>>>>>> feature/login\n```\n\n충돌 마커를 제거하고 원하는 최종 내용을 작성한 뒤:\n\n```bash\ngit status\ngit add 충돌난파일.md\ngit commit                   # 일반 병합 충돌을 수동 해결한 경우\n```\n\n> **팁**\n> 병합을 중단하고 이전 상태로 돌아가려면 `git merge --abort`를 사용할 수 있습니다. 단, 병합 전에 미커밋 변경 사항이 있었다면 복구가 복잡할 수 있어 먼저 작업 상태를 확인하세요.\n\n## 브랜치 삭제\n\n```bash\ngit branch -d feature/login  # 이미 병합된 브랜치를 안전하게 삭제\ngit branch -d feature/login  # 병합 여부와 무관하게 강제 삭제 (주의)\n```\n\n## 함께 보기\n\n- [원격 저장소](./remotes)\n- [상황별 치트시트](./cheatsheet)\n"}, {"id": "remotes", "title": "원격 저장소", "html": "<h1>04. 원격 저장소<\/h1>\n<p>GitHub와 로컬 저장소 사이에서 커밋을 주고받는 명령어를 정리했습니다.<\/p>\n<h2>원격 저장소 복제: <code>git clone<\/code><\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git clone https://github.com/OWNER/REPO.git\n<\/code><\/pre><\/div>\n<p>기존 원격 저장소를 로컬로 복제하고, 보통 <code>origin<\/code>이라는 이름으로 원격을 등록합니다. 비공개 저장소라면 접근 권한과 인증이 필요합니다.<\/p>\n<h2>원격 확인 및 연결: <code>git remote<\/code><\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git remote -v\ngit remote add origin https://github.com/OWNER/REPO.git\n<\/code><\/pre><\/div>\n<p>이미 <code>origin<\/code>이 있으면 <code>add<\/code> 대신 URL 변경이 필요할 수 있습니다.<\/p>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git remote set-url origin https://github.com/OWNER/NEW-REPO.git\n<\/code><\/pre><\/div>\n<h2>원격으로 보내기: <code>git push<\/code><\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git push -u origin main   # main의 업스트림 추적 설정하며 푸시\ngit push                  # 추적 설정된 브랜치를 기본 설정대로 푸시\n<\/code><\/pre><\/div>\n<p><code>push<\/code>는 로컬에 존재하는 커밋을 원격 저장소에 반영합니다. 네트워크 접근 및 쓰기 권한이 필요합니다.<\/p>\n<h2>변경 사항 가져오기: <code>git fetch<\/code><\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git fetch origin\n<\/code><\/pre><\/div>\n<p>원격 브랜치의 최신 이력을 가져오되, <strong>현재 작업 중인 브랜치에 자동으로 병합하지 않습니다<\/strong>.<\/p>\n<h2>가져와 통합하기: <code>git pull<\/code><\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git pull origin main\n<\/code><\/pre><\/div>\n<p>대체로 <code>fetch<\/code> 후 현재 브랜치로 변경 사항을 통합하는 과정입니다. 병합 또는 리베이스 동작은 설정과 옵션에 따라 달라집니다. 로컬과 원격 이력이 분기된 경우 통합 방식을 명시해야 할 수 있습니다.<\/p>\n<h2><code>fetch<\/code> / <code>pull<\/code> / <code>push<\/code> 비교<\/h2>\n<table>\n<thead>\n<tr>\n  <th>명령어<\/th>\n  <th>데이터 이동<\/th>\n  <th>현재 브랜치에 반영<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>git fetch<\/code><\/td>\n  <td>원격 → 로컬의 원격 추적 정보<\/td>\n  <td>자동으로 통합하지 않음<\/td>\n<\/tr>\n<tr>\n  <td><code>git pull<\/code><\/td>\n  <td>원격 → 로컬<\/td>\n  <td>가져온 뒤 통합 시도<\/td>\n<\/tr>\n<tr>\n  <td><code>git push<\/code><\/td>\n  <td>로컬 → 원격<\/td>\n  <td>원격 브랜치를 갱신<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>비공개 저장소 접근<\/h2>\n<p>비공개 GitHub 저장소를 다른 노트북에서 사용하려면 그 노트북에서도 GitHub 인증을 설정하고, <code>git clone<\/code> 또는 <code>git pull<\/code>을 사용하세요.<\/p>\n<h2>함께 보기<\/h2>\n<ul>\n<li><a href=\"#concepts\">핵심 개념<\/a><\/li>\n<li><a href=\"#cheatsheet\">상황별 치트시트<\/a><\/li>\n<\/ul>\n", "plain": "# 04. 원격 저장소\n\ngithub와 로컬 저장소 사이에서 커밋을 주고받는 명령어를 정리했습니다.\n\n## 원격 저장소 복제: `git clone`\n\n```bash\ngit clone https://github.com/owner/repo.git\n```\n\n기존 원격 저장소를 로컬로 복제하고, 보통 `origin`이라는 이름으로 원격을 등록합니다. 비공개 저장소라면 접근 권한과 인증이 필요합니다.\n\n## 원격 확인 및 연결: `git remote`\n\n```bash\ngit remote -v\ngit remote add origin https://github.com/owner/repo.git\n```\n\n이미 `origin`이 있으면 `add` 대신 url 변경이 필요할 수 있습니다.\n\n```bash\ngit remote set-url origin https://github.com/owner/new-repo.git\n```\n\n## 원격으로 보내기: `git push`\n\n```bash\ngit push -u origin main   # main의 업스트림 추적 설정하며 푸시\ngit push                  # 추적 설정된 브랜치를 기본 설정대로 푸시\n```\n\n`push`는 로컬에 존재하는 커밋을 원격 저장소에 반영합니다. 네트워크 접근 및 쓰기 권한이 필요합니다.\n\n## 변경 사항 가져오기: `git fetch`\n\n```bash\ngit fetch origin\n```\n\n원격 브랜치의 최신 이력을 가져오되, **현재 작업 중인 브랜치에 자동으로 병합하지 않습니다**.\n\n## 가져와 통합하기: `git pull`\n\n```bash\ngit pull origin main\n```\n\n대체로 `fetch` 후 현재 브랜치로 변경 사항을 통합하는 과정입니다. 병합 또는 리베이스 동작은 설정과 옵션에 따라 달라집니다. 로컬과 원격 이력이 분기된 경우 통합 방식을 명시해야 할 수 있습니다.\n\n## `fetch` / `pull` / `push` 비교\n\n| 명령어 | 데이터 이동 | 현재 브랜치에 반영 |\n| --- | --- | --- |\n| `git fetch` | 원격 → 로컬의 원격 추적 정보 | 자동으로 통합하지 않음 |\n| `git pull` | 원격 → 로컬 | 가져온 뒤 통합 시도 |\n| `git push` | 로컬 → 원격 | 원격 브랜치를 갱신 |\n\n## 비공개 저장소 접근\n\n비공개 github 저장소를 다른 노트북에서 사용하려면 그 노트북에서도 github 인증을 설정하고, `git clone` 또는 `git pull`을 사용하세요.\n\n## 함께 보기\n\n- [핵심 개념](./concepts)\n- [상황별 치트시트](./cheatsheet)\n"}, {"id": "cheatsheet", "title": "상황별 치트시트", "html": "<h1>05. 상황별 치트시트<\/h1>\n<p>명령어를 외우지 않아도 <strong>하고 싶은 작업<\/strong>을 기준으로 찾을 수 있도록 정리했습니다.<\/p>\n<h2>방금 수정한 파일을 커밋하고 싶을 때<\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git status\ngit add README.md\ngit commit -m &quot;docs: update README&quot;\n<\/code><\/pre><\/div>\n<h2>내가 어느 브랜치에 있는지 모를 때<\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git branch --show-current\ngit status\n<\/code><\/pre><\/div>\n<h2>새 기능을 별도 브랜치에서 만들고 싶을 때<\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git switch -c feature/new-page\n<\/code><\/pre><\/div>\n<h2>GitHub에 변경 사항을 올리고 싶을 때<\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git push -u origin feature/new-page\n<\/code><\/pre><\/div>\n<h2>원격에 새로운 커밋이 있는지만 확인하고 싶을 때<\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git fetch origin\ngit log --oneline HEAD..origin/main\n<\/code><\/pre><\/div>\n<p>현재 브랜치가 <code>main<\/code>을 기반으로 작업하는 경우의 예시입니다. 원격 브랜치명은 실제 사용 환경에 맞추세요.<\/p>\n<h2>파일 수정 내용을 비교하고 싶을 때<\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git diff\ngit diff --staged\n<\/code><\/pre><\/div>\n<h2>마지막 커밋들을 빠르게 보고 싶을 때<\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git log --oneline --graph --decorate -10\n<\/code><\/pre><\/div>\n<h2>아직 커밋하지 않은 작업을 잠시 치워두고 싶을 때<\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git stash push -m &quot;작업 임시 보관&quot;\ngit stash list\ngit stash pop\n<\/code><\/pre><\/div>\n<p>기본 <code>stash<\/code>는 추적되지 않은 파일을 포함하지 않습니다. 필요하다면 <code>git stash push -u<\/code>를 검토하세요. <code>pop<\/code>에서 충돌이 나면 수동 해결이 필요할 수 있습니다.<\/p>\n<h2>방금 스테이징한 파일을 제외하고 싶을 때<\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git restore --staged README.md\n<\/code><\/pre><\/div>\n<p>스테이징만 취소하며 일반적으로 작업 디렉터리의 파일 수정 내용은 유지합니다.<\/p>\n<h2>충돌이 나서 병합을 중단하고 싶을 때<\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git status\ngit merge --abort\n<\/code><\/pre><\/div>\n<p><code>merge<\/code>를 진행 중일 때 사용할 수 있습니다. <code>pull --rebase<\/code> 등 다른 작업 상황에서는 명령이 달라집니다.<\/p>\n<h2>Git에 연결된 원격 주소가 궁금할 때<\/h2>\n<div class=\"codeblock\"><button class=\"copy\" onclick=\"copyCode(this)\">복사<\/button><pre><code class=\"language-bash\">git remote -v\n<\/code><\/pre><\/div>\n<h2>함께 보기<\/h2>\n<ul>\n<li><a href=\"#basics\">기본 명령어<\/a><\/li>\n<li><a href=\"#branches\">Branch &amp; Merge<\/a><\/li>\n<li><a href=\"#remotes\">원격 저장소<\/a><\/li>\n<\/ul>\n", "plain": "# 05. 상황별 치트시트\n\n명령어를 외우지 않아도 **하고 싶은 작업**을 기준으로 찾을 수 있도록 정리했습니다.\n\n## 방금 수정한 파일을 커밋하고 싶을 때\n\n```bash\ngit status\ngit add readme.md\ngit commit -m \"docs: update readme\"\n```\n\n## 내가 어느 브랜치에 있는지 모를 때\n\n```bash\ngit branch --show-current\ngit status\n```\n\n## 새 기능을 별도 브랜치에서 만들고 싶을 때\n\n```bash\ngit switch -c feature/new-page\n```\n\n## github에 변경 사항을 올리고 싶을 때\n\n```bash\ngit push -u origin feature/new-page\n```\n\n## 원격에 새로운 커밋이 있는지만 확인하고 싶을 때\n\n```bash\ngit fetch origin\ngit log --oneline head..origin/main\n```\n\n현재 브랜치가 `main`을 기반으로 작업하는 경우의 예시입니다. 원격 브랜치명은 실제 사용 환경에 맞추세요.\n\n## 파일 수정 내용을 비교하고 싶을 때\n\n```bash\ngit diff\ngit diff --staged\n```\n\n## 마지막 커밋들을 빠르게 보고 싶을 때\n\n```bash\ngit log --oneline --graph --decorate -10\n```\n\n## 아직 커밋하지 않은 작업을 잠시 치워두고 싶을 때\n\n```bash\ngit stash push -m \"작업 임시 보관\"\ngit stash list\ngit stash pop\n```\n\n기본 `stash`는 추적되지 않은 파일을 포함하지 않습니다. 필요하다면 `git stash push -u`를 검토하세요. `pop`에서 충돌이 나면 수동 해결이 필요할 수 있습니다.\n\n## 방금 스테이징한 파일을 제외하고 싶을 때\n\n```bash\ngit restore --staged readme.md\n```\n\n스테이징만 취소하며 일반적으로 작업 디렉터리의 파일 수정 내용은 유지합니다.\n\n## 충돌이 나서 병합을 중단하고 싶을 때\n\n```bash\ngit status\ngit merge --abort\n```\n\n`merge`를 진행 중일 때 사용할 수 있습니다. `pull --rebase` 등 다른 작업 상황에서는 명령이 달라집니다.\n\n## git에 연결된 원격 주소가 궁금할 때\n\n```bash\ngit remote -v\n```\n\n## 함께 보기\n\n- [기본 명령어](./basics)\n- [branch & merge](./branches)\n- [원격 저장소](./remotes)\n"}];const nav=document.getElementById('nav'),doc=document.getElementById('doc'),search=document.getElementById('search'),results=document.getElementById('results');
function display(id){const p=pages.find(p=>p.id===id)||pages[0];doc.innerHTML=p.html;document.title=p.title+' · Dev Wiki';nav.innerHTML=pages.map(x=>'<button class="nav '+(x.id===p.id?'active':'')+'" data-id="'+x.id+'">'+x.title+'</button>').join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.id});results.style.display='none';search.value='';window.scrollTo(0,0);}
function lookup(){const q=search.value.trim().toLowerCase();if(!q){results.style.display='none';return;}const matches=pages.filter(p=>p.plain.includes(q)||p.title.toLowerCase().includes(q));results.innerHTML=matches.length?matches.map(p=>'<button data-id="'+p.id+'">'+p.title+'<span>Git & GitHub 문서 열기</span></button>').join(''):'<div class="nores">일치하는 문서가 없습니다</div>';results.style.display='block';results.querySelectorAll('button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.id;});}
function copyCode(btn){navigator.clipboard.writeText(btn.parentElement.querySelector('code').innerText).then(()=>{btn.innerText='복사됨';setTimeout(()=>btn.innerText='복사',1200)}).catch(()=>{btn.innerText='복사 실패'});}
window.addEventListener('hashchange',()=>display(location.hash.slice(1)));search.addEventListener('input',lookup);display(location.hash.slice(1)||'index');
</script></body></html>
